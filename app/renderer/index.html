<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#12151d" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' http://127.0.0.1:* http://localhost:*; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:;" />
<title>Globaal Elevate — Účetní systém</title>
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<script>
  // Aplikuj uložené (nebo systémové) téma ještě před vykreslením — bez bliknutí.
  try {
    var _t = localStorage.getItem("theme") || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", _t);
  } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>
    // preload.js (Electron) nastaví window.ucetnictvi ještě před načtením
    // téhle stránky — tady se řeší jen zbylé dva případy: `npm run
    // dev:renderer` (statický server na :5173 proti `npm run dev:server`
    // na :4000), a skutečné webové nasazení (Vercel), kde API běží na
    // stejné doméně pod relativní cestou /api.
    if (!window.ucetnictvi) {
      window.ucetnictvi = { apiBase: location.port === "5173" ? "http://127.0.0.1:4000/api" : "/api" };
    }
    // Tenký klient (2026-07-09): Service Worker cachuje poslední úspěšné GET
    // /api/* odpovědi + appku samotnou, aby offline zůstalo aspoň read-only
    // zobrazení naposledy stažených dat (nikdy offline zápis — viz sw.js).
    // Jen na skutečné doméně (ne na dev :5173 statickém serveru, tam sw.js
    // neexistuje a registrace by jen hlučela do konzole).
    if ("serviceWorker" in navigator && location.port !== "5173") {
      navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("sw register:", e));
    }
  </script>
  <div id="splashScreen" class="splash-screen">
    <div class="splash-logo-plate"><img src="assets/logo.png" alt="Globaal Elevate Production" class="splash-logo" /></div>
  </div>
  <div id="authScreen" class="auth-screen hidden"></div>
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <div class="brand-logo-plate"><img src="assets/logo.png" alt="Globaal Elevate Production" class="brand-logo" /></div>
          <div class="brand-text">
            <div class="brand-sub">Účetní systém</div>
          </div>
        </div>
        <nav id="nav" class="topnav"></nav>
      </div>
      <div class="topbar-right">
        <div id="vatBadge" class="vat-badge">DPH: —</div>
        <div id="whoAmI" class="app-version"></div>
        <button class="theme-toggle" data-action="toggle-theme" data-theme-toggle aria-label="Přepnout světlý/tmavý režim"></button>
      </div>
    </header>
    <div class="pagebar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
    <main class="content">
      <div id="view" class="view"></div>
    </main>
    <nav id="bottomNav" class="bottom-nav"></nav>
    <div id="bottomSheetBackdrop" class="bottom-sheet-backdrop hidden" data-action="close-bottom-sheet">
      <div class="bottom-sheet" id="bottomSheet"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
